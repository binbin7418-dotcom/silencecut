name: build-windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build
        run: pyinstaller silencecut.spec
      - name: Fetch auto-editor (pinned release, Unlicense)
        run: |
          Invoke-WebRequest -Uri "https://github.com/WyattBlue/auto-editor/releases/download/31.7.2/auto-editor-windows-x86_64.exe" -OutFile dist/SilenceCut/auto-editor.exe
      - name: Fetch ffmpeg (BtbN static build)
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x
          $bin = Get-ChildItem -Recurse -Directory ffmpeg_x | Where-Object { $_.Name -eq 'bin' } | Select-Object -First 1
          Copy-Item (Join-Path $bin.FullName 'ffmpeg.exe') dist/SilenceCut/
          Copy-Item (Join-Path $bin.FullName 'ffprobe.exe') dist/SilenceCut/
      - name: Package
        run: Compress-Archive -Path dist/SilenceCut -DestinationPath SilenceCut-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SilenceCut-Windows
          path: SilenceCut-Windows.zip
